# HandsFreePC configuration. Copy to config.local.yaml (git-ignored) and edit.
# Every key is optional: missing keys keep these packaged defaults; unknown
# sections are ignored.

# Voice protocol. Say a wake phrase to start a session, end every command with a
# prompt delimiter ("over"), an end phrase to stop taking commands, a stop phrase
# to cancel everything at once. Every phrase here must also appear in
# speech.wake.grammar (space-separated) so the offline detector can hear it.
app:
  language: zh-CN
  wake_phrases:
  - 开始语音操作
  end_session_phrases:
  - 结束语音操作
  stop_phrases:
  - 立即停止所有操作
  - 取消所有操作
  - 停止所有操作
  - 电脑停止
  resume_phrases:
  - 恢复语音操作
  - 恢复监听
  - 继续队列
  - 恢复队列
  prompt_delimiters:
  - over
  feedback_mode: overlay
  max_queue_size: 8
  max_prompt_chars: 4000
  failure_policy: continue
  auto_pause_when_microphone_busy: true
  microphone_guard_poll_seconds: 3.0
  microphone_guard_ignore: []

# Nothing is written to disk unless you opt in.
privacy:
  save_transcripts: false

# Local speech chain: Silero VAD, a Vosk grammar detector for the control phrases,
# a Vosk English detector for "over", and SenseVoice or faster-whisper for the
# command text. Paths are relative to this file.
speech:
  sample_rate: 16000
  input_device: null
  pre_roll_seconds: 1.2
  trailing_silence_seconds: 0.8
  max_utterance_seconds: 25
  min_speech_seconds: 0.25
  energy_threshold: 0.012
  noise_multiplier: 3.0
  vad:
    backend: silero
    model_path: models/silero-vad-v6.2.1/silero_vad.onnx
    threshold: 0.5
    min_silence_duration: 0.5
    min_speech_duration: 0.15
    max_speech_duration: 30.0
    window_size: 512
  wake:
    backend: vosk
    model_path: models/vosk-model-small-cn-0.22
    grammar:
    - 开始 语音 操作
    - 结束 语音 操作
    - 立即 停止 所有 操作
    - 取消 所有 操作
    - 停止 所有 操作
    - 电脑 停止
    - 恢复 语音 操作
    - 恢复 监听
    - 继续 队列
    - 恢复 队列
    phrase_window_seconds: 5.0
  delimiter:
    backend: vosk
    model_path: models/vosk-model-small-en-us-0.15
    grammar:
    - over
    phrase_window_seconds: 2.0
  command:
    backend: sensevoice
    model_path: models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17
    model: large-v3-turbo
    language: auto
    use_itn: true
    num_threads: 4
    provider: cpu
    device: auto
    compute_type: auto
    beam_size: 5
    initial_prompt: 语音控制命令可能包含 Claude、Codex、ChatGPT、Chrome、资源管理器、微信、Chat and Cowork、Design 和 over。
    hotwords: Claude Codex ChatGPT 聊天GPT Chrome 资源管理器 文件资源管理器 微信 WeChat Chat and Cowork Design over
  fallback:
    backend: none
    model: large-v3-turbo
    device: auto
    compute_type: auto
    language: zh
    beam_size: 5
    initial_prompt: 语音控制命令可能包含 Claude、Codex、ChatGPT、Chrome、资源管理器、微信、Chat and Cowork、Design 和 over。
    hotwords: Claude Codex ChatGPT 聊天GPT Chrome 资源管理器 文件资源管理器 微信 WeChat Chat and Cowork Design over

# The executor. Every command is handed to Kimi Code CLI in prompt mode; Kimi
# drives the desktop with its gui-control skill.
kimi:
  executable: kimi
  working_directory: null
  model: null
  skills_dir: null
  preamble_file: null
  resume_session: false
  timeout_seconds: 600
