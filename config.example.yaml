app:
  language: zh-CN
  wake_phrases:
    - "开始语音操作"
  end_session_phrases:
    - "结束语音操作"
  stop_phrases:
    - "立即停止所有操作"
    - "取消所有操作"
    - "停止所有操作"
    - "电脑停止"
  prompt_delimiters:
    - over
  control_prefixes:
    - "电脑"
  awake_timeout_seconds: 0
  feedback_mode: overlay

privacy:
  save_audio: false
  save_transcripts: false
  redact_paths_in_logs: true
  allow_cloud_planner: false

speech:
  sample_rate: 16000
  input_device: null
  pre_roll_seconds: 1.2
  trailing_silence_seconds: 0.8
  max_utterance_seconds: 25
  min_speech_seconds: 0.25
  energy_threshold: 0.012
  noise_multiplier: 3.0
  vad:
    backend: silero
    model_path: models/silero-vad-v6.2.1/silero_vad.onnx
    threshold: 0.5
    min_silence_duration: 0.5
    min_speech_duration: 0.15
    max_speech_duration: 30.0
    window_size: 512
  wake:
    backend: vosk
    model_path: models/vosk-model-small-cn-0.22
    grammar:
      - "开始 语音 操作"
      - "结束 语音 操作"
      - "立即 停止 所有 操作"
      - "取消 所有 操作"
      - "停止 所有 操作"
      - "电脑 停止"
      - "恢复 语音 操作"
      - "恢复 监听"
      - "确认 执行"
      - "取消 操作"
      - "不要 执行"
      - "继续 队列"
      - "恢复 队列"
    phrase_window_seconds: 5.0
  command:
    backend: sensevoice
    model_path: models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17
    language: auto
    use_itn: true
    num_threads: 4
    provider: cpu
  fallback:
    backend: none
    model: large-v3-turbo
    device: auto
    compute_type: auto

planner:
  # Legacy one-shot VoiceRuntime fallback only. Cloud output is locally restricted
  # to affirmatively and exactly authorized app UI navigation; it cannot choose
  # feedback/pause/resume/wait/path/text/send actions.
  enabled: false
  backend: claude
  timeout_seconds: 90
  model: null
  codex_executable: codex
  claude_executable: claude

computer_control:
  enabled: false
  backend: local_agent
  driver: windows_uia
  # Each generic spoken task must affirmatively name exactly one configured app.
  # Every generic planner action needs a locally checkable false-before/true-after
  # condition. Deterministic native skills use action-specific local evidence.
  # claude is the default strict planner. Other accepted values are
  # codex_cli_best_effort (requires separate host-read consent) and none.
  planner_backend: claude
  allow_screen_context_to_cloud: false
  # Codex subscription CLI has no complete no-tools mode. This separate consent
  # is required for any enabled Codex CLI planner or legacy Codex controller.
  allow_codex_cli_host_read: false
  # Legacy Codex Computer Use has broader tools and no 0.3 local action verifier.
  allow_legacy_codex_computer_use: false
  timeout_seconds: 600
  max_steps: 20
  max_observation_chars: 24000
  max_queue_size: 8
  max_prompt_chars: 4000
  failure_policy: pause
  end_policy: drain
  working_directory: runtime/computer-control
  codex_executable: codex
  claude_executable: claude
  model: null
  open_computer_use_executable: open-computer-use
  open_computer_use_args: [mcp]
  allow_experimental_driver: false
  allow_coordinate_actions: false

execution:
  dry_run: true
  ambiguity_threshold: 0.78
  max_search_results: 5
  confirmation_timeout_seconds: 15
  # This is only the spoken prefix. Runtime appends a new random four-digit
  # one-time challenge within the current VoiceRuntime process; codes are not
  # persisted across restarts, and the static prefix alone never authorizes.
  confirmation_phrases:
    - "确认执行"
  cancellation_phrases:
    - "取消操作"
    - "不要执行"
  blocked_keywords:
    - "删除"
    - "格式化"
    - "付款"
    - "转账"
    - "输入密码"
  path_aliases:
    桌面: "%USERPROFILE%\\Desktop"
    文档: "%USERPROFILE%\\Documents"
    下载: "%USERPROFILE%\\Downloads"
  search_roots: []

# Canonical spoken modes map to exact, version-specific accessible labels.
# Labels are tried in order; a fuzzy-only match is rejected.
apps:
  codex:
    process_names: ["ChatGPT.exe", "codex.exe"]
    executable: null
    title_patterns: ["ChatGPT", "Codex"]
    search_hotkey: null
    native_voice_hotkey: null
    voice_button_names: []
    mode_names:
      chat: ["Chat"]
      code: ["Code"]
  claude:
    process_names: ["claude.exe"]
    executable: null
    title_patterns: ["Claude"]
    search_hotkey: null
    native_voice_hotkey: null
    voice_button_names: []
    mode_names:
      chat: ["Chat and Cowork", "Chat"]
      cowork: ["Chat and Cowork", "Cowork"]
      code: ["Code"]
      design: ["Design"]
