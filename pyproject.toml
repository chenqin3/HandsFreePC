[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handsfree-pc"
version = "0.4.0"
description = "Continuous Windows voice control with an owned, locally verified desktop agent."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "chenqin3" }]
keywords = ["voice-control", "windows", "accessibility", "speech-recognition", "desktop-agent", "computer-use"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Adaptive Technologies",
]
dependencies = [
  "PyYAML>=6.0,<7",
  "psutil>=6,<8",
]

[project.optional-dependencies]
audio = [
  "numpy>=1.26,<3",
  "sounddevice>=0.5,<1",
  "vosk==0.3.45",
  "sherpa-onnx==1.13.6",
]
whisper = ["faster-whisper>=1.1,<2"]
windows = [
  "Pillow>=10,<13; platform_system == 'Windows'",
  "pywin32>=308; platform_system == 'Windows'",
  "pywinauto>=0.6.9,<1; platform_system == 'Windows'",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
  "setuptools>=75",
  "wheel>=0.45,<1",
]
all = [
  "numpy>=1.26,<3",
  "sounddevice>=0.5,<1",
  "vosk==0.3.45",
  "sherpa-onnx==1.13.6",
  "faster-whisper>=1.1,<2",
  "Pillow>=10,<13; platform_system == 'Windows'",
  "pywin32>=308; platform_system == 'Windows'",
  "pywinauto>=0.6.9,<1; platform_system == 'Windows'",
]

[project.scripts]
handsfreepc = "handsfree_pc.cli:main"

[project.urls]
Homepage = "https://github.com/chenqin3/HandsFreePC"
Issues = "https://github.com/chenqin3/HandsFreePC/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["handsfree_pc*"]

[tool.setuptools.package-data]
handsfree_pc = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: tests that exercise local executables or Windows integration",
  "live: tests that can move focus, open windows, or use the microphone",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
